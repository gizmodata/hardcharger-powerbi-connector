# Docker Compose for local integration testing.
#
# Usage:
#   docker compose up -d
#   # ... run isql or other ODBC tests against localhost:31337 ...
#   docker compose down

services:
  hardcharger:
    image: gizmodata/hardcharger:latest
    ports:
      - "31337:31337"
    environment:
      HARDCHARGER_USERNAME: hardcharger_user
      HARDCHARGER_PASSWORD: hardcharger_password
      DATABASE_FILENAME: /tmp/test.duckdb
      TLS_ENABLED: "0"
      PRINT_QUERIES: "1"
