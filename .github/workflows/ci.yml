name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build-test:
    name: Build and full test suite
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install pinned Power Query SDK
        run: ./scripts/Install-Dependencies.ps1 Sdk
      - name: Build and pack connector
        run: ./scripts/Build-Connector.ps1
      - name: Compile signing tool and check dependencies
        run: |
          dotnet build installer/sign-pqx --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Signing tool build failed' }
          dotnet list installer/sign-pqx package --vulnerable --include-transitive
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed' }
      - name: Install released Hardcharger native driver and server
        run: |
          ./scripts/Install-Dependencies.ps1 Driver
          ./scripts/Install-Dependencies.ps1 Server
          python -m pip install adbc-driver-manager==1.12.0 pyarrow==26.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Python test dependency installation failed' }
      - name: Run all Power Query and native ADBC tests
        run: ./scripts/Test-Connector.ps1
      - name: Build and test development MSI (unsigned, not published)
        env:
          CERT_THUMBPRINT: '0000000000000000000000000000000000000000'
        run: |
          ./scripts/Build-Installer.ps1 -Version '1.0.0' -CertThumbprint $env:CERT_THUMBPRINT
          ./scripts/Test-Installer.ps1
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: connector
          path: |
            Hardcharger.mez
            Hardcharger.pqx
          if-no-files-found: error

  sign:
    name: Sign connector and build signed installer
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: connector
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign and verify PQX using Azure Key Vault
        id: pqx
        env:
          VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        run: |
          $output = dotnet run --project installer/sign-pqx -- $env:VAULT_URI $env:CERT_NAME Hardcharger.pqx
          if ($LASTEXITCODE -ne 0) { throw 'PQX signing or verification failed' }
          Write-Host ($output -join "`n")
          $match = [regex]::Match(($output -join "`n"), 'Thumbprint:\s+([0-9A-Fa-f]{40})')
          if (!$match.Success) { throw 'No verified signer thumbprint found' }
          "thumbprint=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - name: Install released Hardcharger driver
        run: ./scripts/Install-Dependencies.ps1 Driver
      - name: Build Hardcharger MSI
        env:
          CERT_THUMBPRINT: ${{ steps.pqx.outputs.thumbprint }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/Build-Installer.ps1 -Version $version -CertThumbprint $env:CERT_THUMBPRINT
      - name: Sign and verify MSI
        env:
          VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
          CERT_THUMBPRINT: ${{ steps.pqx.outputs.thumbprint }}
        run: |
          $deps = Get-Content dependencies.json -Raw | ConvertFrom-Json
          dotnet tool install --global AzureSignTool --version $deps.azureSignTool
          if ($LASTEXITCODE -ne 0) { throw 'AzureSignTool installation failed' }
          AzureSignTool sign --azure-key-vault-url $env:VAULT_URI --azure-key-vault-certificate $env:CERT_NAME --azure-key-vault-managed-identity --timestamp-rfc3161 http://timestamp.digicert.com --timestamp-digest sha256 --file-digest sha256 Hardcharger-PowerBI-Setup-x64.msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed' }
          $signature = Get-AuthenticodeSignature Hardcharger-PowerBI-Setup-x64.msi
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:CERT_THUMBPRINT) { throw 'MSI signature verification failed' }
      - name: Test installation and removal
        env:
          CERT_THUMBPRINT: ${{ steps.pqx.outputs.thumbprint }}
        run: ./scripts/Test-Installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: signed-release
          path: |
            Hardcharger.mez
            Hardcharger.pqx
            Hardcharger-PowerBI-Setup-x64.msi
          if-no-files-found: error

  release:
    name: Publish verified release
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: signed-release
          path: release
      - name: Checksums
        working-directory: release
        run: sha256sum Hardcharger.mez Hardcharger.pqx Hardcharger-PowerBI-Setup-x64.msi > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > /tmp/hardcharger-powerbi-release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "Hardcharger Power BI Connector $GITHUB_REF_NAME" --notes-file /tmp/hardcharger-powerbi-release-notes.md release/*
